<head>

    <title>input</title>

<!-- inp+tap -->
<!-- inp+tap placeholder > 그림 넣고 이름이 없어지고 입력할 수 있음 -->
<!-- inp+tap -->
<!-- inp+tap -->
<!-- input은 짝이 있어야 한다 그게 form -->

<body>
    <form>
        <input type="text" placeholder="아이디를 입력해주세요">
        <input type="password" placeholder="비밀번호를 입력해주세요">
        <input type="checkbox">
       
        <input type="radio" name="라디오버튼"> <!-- 반드시 선택, 선택해지가 안됨, 폼에서 멋어나야한다 -->
        <input type="radio" name="라디오버튼"> <!-- 이름으로 묶어줘야한다 -->
        <input type="radio" name="라디오버튼">
       
        <input type="submit">
    </form>
</body>
